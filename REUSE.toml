# Which licence covers which file (REUSE 3.2, https://reuse.software). The last matching entry wins.
# Code: GPL-3.0-or-later. Docs: CC BY-SA 4.0. Help numbers: CC BY 4.0.
# The starter texts are inline in index.html; the README says they may also be reused under CC BY-SA 4.0.
# Name, logo and icons: all rights reserved.
version = 1

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 okaynowhat <https://github.com/okaynowhat>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# documentation
[[annotations]]
path = ["README.md", "SPEC.md", "DECISIONS.md", "CLAUDE.md", "CONTRIBUTING.md", "TRADEMARKS.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 okaynowhat <https://github.com/okaynowhat>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# help numbers checked against the official sources named in the file
[[annotations]]
path = ["HELP-NUMBERS.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 okaynowhat <https://github.com/okaynowhat>"
SPDX-License-Identifier = "CC-BY-4.0"

# name, logo and icons
[[annotations]]
path = ["icon*.png", "icon.svg", "android/res/drawable*/**", "android/res/mipmap*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 okaynowhat <https://github.com/okaynowhat>"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"
