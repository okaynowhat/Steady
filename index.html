  --accent: #8fbcae; --accent-deep: #b4d8cc; --accent-soft: #23332e; --link: #b4d8cc;
  --warm: #e0a882; --warm-ink: #e0a882; --warm-soft: #3a2c22;
  --sos-a: #8fbcae; --sos-b: #b4d8cc; --on-accent: #141a18;
  --nav: rgba(24,32,29,.82);
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #141a18; --bg2: #18201d; --card: rgba(30,38,35,.85);
    --ink: #e6ece9; --muted: #9aa6a1; --line: #2a3330;
    --accent: #8fbcae; --accent-deep: #b4d8cc; --accent-soft: #23332e; --link: #b4d8cc;
    --warm: #e0a882; --warm-ink: #e0a882; --warm-soft: #3a2c22;
    --sos-a: #8fbcae; --sos-b: #b4d8cc; --on-accent: #141a18;
    --nav: rgba(24,32,29,.82);

* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: 16px; scroll-padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
body {
  background: linear-gradient(180deg, var(--bg2) 0, var(--bg) 320px) no-repeat, var(--bg);
  background-color: var(--bg);
  color: var(--ink); font: 1rem/1.6 var(--sans); min-height: 100vh;
  -webkit-text-size-adjust: 100%; overflow-wrap: anywhere;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.1rem; }
p { margin: 0 0 .75rem; }
a { color: var(--link); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.label { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .6rem; font-weight: 600; font-family: var(--sans); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 18px 16px 6px; max-width: 560px; margin: 0 auto; }
header.top .brand { font-family: var(--serif); font-size: 1.4rem; }
header.top .date { font-size: .85rem; color: var(--muted); }
.iconbtn { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 24px; height: 24px; }

main.wrap { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
main.enter { animation: rise .3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }

.card { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); margin: 14px 0; }
.card > :last-child { margin-bottom: 0; }
.banner { border-radius: 22px; padding: 16px 20px; margin: 14px 0; background: var(--warm-soft); color: var(--ink); border-left: 4px solid var(--warm); }
.banner strong { color: var(--warm-ink); }
.notice { background: var(--accent-soft); border-radius: 16px; padding: 12px 16px; margin: 14px 0; font-size: .9rem; }
.quote { font-family: var(--serif); font-size: 1.35rem; line-height: 1.4; margin: 0; }
.greet { font-family: var(--serif); font-size: 1.1rem; margin: 10px 0 0; color: var(--muted); }

button { font: inherit; }
.btn { min-height: 44px; padding: 10px 22px; border-radius: 999px; border: 0; background: var(--accent-deep); color: var(--on-accent); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--link); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.text { background: transparent; color: var(--link); padding: 10px 8px; }
.btn.danger { background: transparent; color: var(--warm-ink); box-shadow: inset 0 0 0 1px var(--warm); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; min-width: 0; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 14px; }

.sos { width: 100%; border: 0; border-radius: 22px; padding: 26px 22px; text-align: left; cursor: pointer; color: var(--on-accent); background: linear-gradient(135deg, var(--sos-a), var(--sos-b)); box-shadow: var(--shadow); margin: 14px 0; display: block; }
.sos .t { display: block; font-family: var(--serif); font-size: 1.45rem; line-height: 1.3; font-weight: 700; }
.sos .s { display: block; margin-top: 6px; font-size: 1.05rem; font-weight: 600; }
.sos.pulse { animation: pulse 1.2s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.025); box-shadow: 0 0 0 8px var(--accent-soft), var(--shadow); } }

label.f { display: block; font-size: .9rem; margin: 12px 0 4px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="tel"], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 88px; resize: vertical; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

ul.plain, ol.plain { list-style: none; padding: 0; margin: 0; }
ol.rules { padding-left: 1.4rem; margin: 0; }
ol.rules li { padding: 6px 0; }
ul.bul { margin: 0; padding-left: 1.2rem; }
ul.bul li { margin: 4px 0; }

.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check .box { flex: none; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--accent); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.check .box svg { width: 16px; height: 16px; }
.check input:checked + .box { background: var(--accent-deep); box-shadow: none; color: var(--on-accent); }
.check input:checked ~ .txt { text-decoration: line-through; opacity: .6; }
.check input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }
details.how { margin: 0 0 8px 34px; font-size: .9rem; color: var(--muted); }
details.how summary { cursor: pointer; min-height: 32px; color: var(--link); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { background: var(--accent-soft); border-radius: 18px; padding: 14px; }
.stat .v { font-family: var(--serif); font-size: 1.9rem; line-height: 1.1; }
.stat .k { font-size: .85rem; color: var(--ink); margin-top: 4px; }
.stat .b { font-size: .8rem; color: var(--muted); margin-top: 2px; }

.worry { border-top: 1px solid var(--line); padding: 12px 0; }
.worry:first-child { border-top: 0; }
.worry .when { font-size: .85rem; color: var(--muted); }
.due { background: var(--warm-soft); border-radius: 16px; padding: 12px 14px; margin-top: 8px; }

nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 24px; background: var(--nav); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--shadow); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; border-radius: 18px; color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 600; text-align: center; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }

.scale { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin: 14px 0; }
.scale button { min-height: 48px; border-radius: 14px; border: 0; background: var(--accent-soft); color: var(--ink); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.scale button[aria-pressed="true"] { background: var(--accent-deep); color: var(--on-accent); }
.progress { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 6px 0 18px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--accent); }
.sosview { min-height: 100vh; padding: 16px 16px 40px; max-width: 560px; margin: 0 auto; }
.sosview .bar { display: flex; align-items: center; justify-content: space-between; }
.big { font-family: var(--serif); font-size: 1.6rem; line-height: 1.35; margin: 8px 0 14px; }
.orbwrap { display: flex; align-items: center; justify-content: center; height: 300px; }
.orb { width: 240px; height: 240px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 42% 38%, #ffffff 0, #e6efeb 45%, #c9ddd6 100%); box-shadow: 0 0 0 14px rgba(111,154,141,.12), 0 0 0 30px rgba(111,154,141,.07); transform: scale(.62); transition-property: transform; transition-timing-function: ease-in-out; }
.orb span { font-family: var(--serif); font-size: 1.6rem; color: #2e3a36; }
.timer { font-family: var(--serif); font-size: 2.4rem; text-align: center; margin: 6px 0; font-variant-numeric: tabular-nums; }
.chips { display: grid; gap: 8px; margin: 12px 0; }
.chip { text-align: left; min-height: 48px; padding: 10px 16px; border-radius: 16px; border: 0; background: var(--accent-soft); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent-deep); }
.safety { background: var(--warm-soft); border-radius: 18px; padding: 14px 16px; margin: 14px 0; }
.safety strong { display: block; margin-bottom: 4px; color: var(--warm-ink); }

.num { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.num:last-child { border-bottom: 0; }
.num a { font-weight: 700; white-space: nowrap; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; }

.habit { padding: 10px 0; border-bottom: 1px solid var(--line); }
.habit:last-child { border-bottom: 0; }
.boxes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.boxes button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--on-accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.boxes button svg { width: 20px; height: 20px; }
.boxes button[aria-pressed="true"] { background: var(--accent-deep); }

.entry { border-top: 1px solid var(--line); padding: 10px 0; }
.entry:first-child { border-top: 0; }
.entry summary { cursor: pointer; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
.entry dl { margin: 8px 0; }
.entry dt { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.entry dd { margin: 0; }

.ed { border-bottom: 1px solid var(--line); padding: 10px 0; }
.ed .row { flex-wrap: nowrap; }
.ed .tools { display: flex; gap: 2px; flex: none; }
.ed .tools .iconbtn svg { width: 20px; height: 20px; }
.setrow { margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--accent-soft); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-deep); color: var(--on-accent); }
.ob { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 18px 0 0; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--accent-deep); }
.pack { width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 14px 16px; margin: 8px 0; background: var(--accent-soft); color: var(--ink); cursor: pointer; min-height: 56px; }
.pack[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent-deep); }
.pack strong { display: block; font-family: var(--serif); font-weight: 400; font-size: 1.1rem; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 30; max-width: calc(100vw - 32px); font-size: .95rem; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .orb { transform: none !important; }
}
</style>
